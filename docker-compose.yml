services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgrow
      POSTGRES_PASSWORD: pgrow
      POSTGRES_DB: pgrow
    ports:
      - "5432:5432"
    volumes:
      - pgrow-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgrow-data:
