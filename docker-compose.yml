# Production / VPS parity file. WINDOWS DEV does NOT use this:
# dev Postgres runs as a native Windows service (simpler, no WSL/Docker).
# The VPS runs postgres + api + worker from Compose (api/worker images added later).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgrow
      POSTGRES_PASSWORD: pgrow
      POSTGRES_DB: pgrow
    ports:
      - "5432:5432"
    volumes:
      - pgrow-data:/var/lib/postgresql/data

volumes:
  pgrow-data:
